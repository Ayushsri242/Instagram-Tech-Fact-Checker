name: Build Debug APK (mobile_app)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle build type"
        type: choice
        default: "debug"
        options:
          - debug
          - release

jobs:
  build:
    name: Build React Native APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "--- before ---"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo apt-get clean || true
          echo "--- after ---"; df -h / | tail -1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile_app/android/**/*.gradle*', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install JS dependencies
        working-directory: mobile_app
        run: npm ci --legacy-peer-deps

      - name: Patch expo-modules-core for Gradle 8.x debug builds
        working-directory: mobile_app
        run: |
          PLUGIN="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN" ]; then
            sed -i 's/from components\.release/from(components.findByName("release") ?: components.findByName("debug"))/g' "$PLUGIN"
            echo "Patched ExpoModulesCorePlugin.gradle"
            grep -n "from(" "$PLUGIN" | head -5
          else
            echo "Plugin file not found, skipping patch"
          fi

      # Every build gets its own, always-increasing version: 1.0.<run number>.
      # The in-app updater offers a release only if its version is higher than
      # the installed one, and the version used to change only when someone
      # edited app.json by hand - so promoting a new build could reach nobody.
      # app.json's version is what the app reads (expo-constants); versionCode
      # and versionName are what Android shows in App info.
      - name: Stamp version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          node -e '
            const fs = require("fs");
            const p = "mobile_app/app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.version = process.env.V;
            j.expo.android = Object.assign({}, j.expo.android, { versionCode: Number(process.env.N) });
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" mobile_app/android/app/build.gradle
          grep -n '"version"' mobile_app/app.json
          grep -nE "versionCode|versionName" mobile_app/android/app/build.gradle
        env:
          V: 1.0.${{ github.run_number }}
          N: ${{ github.run_number }}

      - name: Resolve build type
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            echo "GRADLE_TASK=assembleDebug" >> $GITHUB_ENV
            echo "APK_DIR=mobile_app/android/app/build/outputs/apk/debug" >> $GITHUB_ENV
          else
            echo "GRADLE_TASK=assembleRelease" >> $GITHUB_ENV
            echo "APK_DIR=mobile_app/android/app/build/outputs/apk/release" >> $GITHUB_ENV
          fi

      - name: Build APK
        working-directory: mobile_app/android
        run: ./gradlew $GRADLE_TASK --no-daemon --build-cache --stacktrace

      - name: APK size info
        run: |
          APK=$(ls "$APK_DIR"/*.apk | head -1)
          echo "BUILD_TYPE=${{ inputs.build_type }}"
          ls -lh "$APK"

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls "$APK_DIR"/*.apk | head -1)
          if [ ! -f "$APK" ]; then
            echo "ERROR: no APK found under $APK_DIR"; exit 1
          fi
          TAG="mobile-${{ inputs.build_type }}-${{ github.run_number }}"
          NOTES=$(printf '%s\n' \
            "build_type=${{ inputs.build_type }}" \
            "version=$APP_VERSION" \
            "branch=${{ github.ref_name }}" \
            "commit=${{ github.sha }}" \
            "" \
            "Download: gh release download $TAG --repo ${{ github.repository }}")
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Tech Fact Checker ${{ inputs.build_type }} #${{ github.run_number }}" \
            --notes "$NOTES"
          echo "Published $TAG -> $(basename "$APK")"

      - name: Free disk before cache save
        if: always()
        run: |
          df -h / | tail -1
          rm -rf mobile_app/android/app/build/intermediates || true
          df -h / | tail -1

      - name: Save Gradle cache
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile_app/android/**/*.gradle*', 'mobile_app/android/gradle/wrapper/gradle-wrapper.properties') }}
